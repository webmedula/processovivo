name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A MESMA versão do Dockerfile (`node:24-alpine`) e do `engines`. No 22 o
      # `node:sqlite` ainda é experimental: a suíte verde não provava o runtime
      # que vai para o VPS (v0.65.3).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Só as dependências de PRODUÇÃO, e só o nível crítico derruba o CI: as
      # altas que restam (zod 3, fast-xml-parser 4) exigem troca de versão
      # maior e ficam com o Dependabot. Subir o nível é decisão à parte.
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=critical

      # O leitor de peças monta PDF com qpdf, e os testes dele rodam o qpdf de
      # verdade — é a única forma de provar que o índice bate com o arquivo.
      # O pdftotext (poppler) lê de volta o texto do HTML convertido: é como o
      # teste confere acento, entidade e que nenhuma marcação vazou.
      - name: Ferramentas de PDF
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Construir a imagem no CI pega o erro de Dockerfile ANTES do deploy.
      # Descobrir que o build quebrou pelo log do Easypanel é caro: o serviço
      # fica fora enquanto você investiga.
      - name: Build da imagem Docker
        run: docker build -t processovivo:ci .
